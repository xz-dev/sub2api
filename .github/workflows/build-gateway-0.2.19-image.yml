name: Build gateway candidate 0.2.19

on:
  push:
    branches:
      - maintenance/gateway-v0.2.19-trim-ws
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-gateway-candidate-0.2.19
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xz-dev/sub2api

jobs:
  build:
    if: github.repository == 'xz-dev/sub2api'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}

      - name: Test immutable tag guard
        run: python3 deploy/tests/gateway-image-tag-guard-test.py

      - name: Derive immutable candidate version
        id: revision
        shell: bash
        run: |
          version="0.2.19-pr7157-pr7217-pr8191-${GITHUB_SHA:0:7}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a candidate tag
        env:
          VERSION: ${{ steps.revision.outputs.version }}
        shell: bash
        run: |
          if lookup_error="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo 'Candidate tag already exists; refusing to overwrite it.' >&2
            exit 1
          else
            lookup_status=$?
            case "$lookup_error" in
              "ERROR: $IMAGE:$VERSION: not found")
                echo 'Verified that the candidate manifest does not exist.'
                ;;
              *)
                printf '%s\n' "$lookup_error" >&2
                exit "$lookup_status"
                ;;
            esac
          fi

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.revision.outputs.version }}
          build-args: |
            VERSION=${{ steps.revision.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/xz-dev/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.revision.outputs.version }}

      - name: Record source and digest
        env:
          SOURCE_SHA: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          printf 'Source: %s\nImage: %s:%s@%s\n' "$SOURCE_SHA" "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
