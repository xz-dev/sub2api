name: ghcr-ci
on:
  push:
    branches: [ci-ai-gateway-v0.2.25-r3-20261126]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      APPROVED_SHA: "6ffd757b3b29cddaba73f6fdd55b7d50fe29d96c"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check approved head
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$APPROVED_SHA"
          test "$(git diff --name-only "$APPROVED_SHA" HEAD)" = .github/workflows/ghcr-ci.yml
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=ci-${APPROVED_SHA:0:10}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test request, routing and capacity regressions
        working-directory: backend
        run: >-
          go test -count=1 -tags unit -p 2 -parallel 2
          -run 'Responses|Codex|GPT62|Prompt|AsyncAudit|Passthrough|Allowlist|RawBody|Capacity|ImageGeneration|Rerank|RequestDecodeSites'
          ./internal/service ./internal/handler ./internal/securityaudit ./internal/server/routes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ env.APPROVED_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ env.APPROVED_SHA }}
            DATE=${{ steps.meta.outputs.date }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
      - name: Output digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_REF=${IMAGE}@${DIGEST}"
          echo "Published \`${IMAGE}@${DIGEST}\` (revision ${APPROVED_SHA})" >> "$GITHUB_STEP_SUMMARY"
