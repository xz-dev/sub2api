name: Build v0.1.179 model-list candidate

on:
  push:
    branches:
      - ci/v0.1.179-model-list-read-limit-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v0.1.179-model-list-read-limit-image
  cancel-in-progress: false

env:
  SOURCE_SHA: 7082112773b854b816d32fe1d48b7f1e3b820aaa
  IMAGE: ghcr.io/xz-dev/sub2api
  IMAGE_TAG: 0.1.179-model-list-read-limit-7082112

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact amd64 candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            NODE_IMAGE=docker.io/library/node:24-alpine
            GOLANG_IMAGE=docker.io/library/golang:1.26.6-alpine
            ALPINE_IMAGE=docker.io/library/alpine:3.21
            POSTGRES_IMAGE=docker.io/library/postgres:18-alpine
            VERSION=0.1.179
            COMMIT=${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/xz-dev/sub2api
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=0.1.179-model-list-read-limit
          cache-from: type=gha,scope=v0.1.179-model-list-read-limit-amd64
          cache-to: type=gha,mode=max,scope=v0.1.179-model-list-read-limit-amd64

      - name: Record immutable image
        run: echo "${IMAGE}:${IMAGE_TAG}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
